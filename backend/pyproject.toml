[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.6.3",
    "crawl4ai>=0.9.0",
    "fastapi[standard]>=0.112.1",
    "langchain-core>=1.4.8",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pydantic-settings>=2.14.2",
    "pymilvus>=3.0.0",
    "pypdf>=6.14.2",
    "sentence-transformers>=5.6.0",
    "slowapi>=0.1.10",
    "sse-starlette>=3.0.3",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (common bugs/design issues)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern syntax for target Python)
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.flake8-bugbear]
# Allow FastAPI's default-argument injection pattern, e.g. `q: str = Query(None)`,
# without disabling B008 (function-call-in-default-argument) globally.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]
